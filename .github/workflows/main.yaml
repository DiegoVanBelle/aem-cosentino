name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - run: npm ci
    - run: npm run build
    - run: npm test
    - run: npm run lint
    - run: git diff --exit-code -- scripts/react-islands.js styles/react-tailwind.css component-definition.json component-models.json component-filters.json
